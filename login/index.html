<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Login & Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="scene" aria-label="Login and registration">
    <div class="tile-grid" aria-hidden="true"></div>

    <main class="auth-card">
      <div class="form-panel active" id="loginPanel">
        <div class="content">
          <h2>Sign In</h2>
          <form class="form" id="loginForm">
            <div class="inputBox">
              <input type="email" id="loginEmail" required autocomplete="email" />
              <i>Email</i>
            </div>
            <div class="inputBox">
              <input type="password" id="loginPassword" required minlength="6" autocomplete="current-password" />
              <i>Password</i>
            </div>
            <div class="links">
              <a href="#" id="forgotLink">Forgot Password?</a>
              <a href="#" id="showSignup">Sign Up</a>
            </div>
            <div class="inputBox">
              <input type="submit" value="Login" />
            </div>
          </form>
          <p class="notice" id="loginNotice" role="status"></p>
        </div>
      </div>

      <div class="form-panel" id="signupPanel" aria-hidden="true">
        <div class="content">
          <h2>Sign Up</h2>
          <form class="form" id="signupForm">
            <div class="inputBox">
              <input type="text" id="fullName" required autocomplete="name" />
              <i>Full Name</i>
            </div>
            <div class="inputBox">
              <input type="email" id="signupEmail" required autocomplete="email" />
              <i>Email</i>
            </div>
            <div class="inputBox">
              <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password" />
              <i>Password (6+ characters)</i>
            </div>
            <div class="links">
              <span>Already have an account?</span>
              <a href="#" id="showLogin">Sign In</a>
            </div>
            <div class="inputBox">
              <input type="submit" value="Create Account" />
            </div>
          </form>
          <p class="notice" id="signupNotice" role="status"></p>
        </div>
      </div>
    </main>
  </section>
  <script src="script.js"></script>
</body>
</html>
