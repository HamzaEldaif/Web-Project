<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css" />
</head>
<body>
    <section class="scene" aria-label="Registration">
    <div class="tile-grid" aria-hidden="true"></div>

    <main class="auth-card">
        <div class="content">
        <h2>Sign Up</h2>
        <form class="form" data-notice="Demo only: registration will be connected to the backend in Milestone 2.">
            <div class="inputBox">
            <input type="text" required autocomplete="name" />
            <i>Full Name</i>
            </div>
            <div class="inputBox">
            <input type="email" required autocomplete="email" />
            <i>Email</i>
            </div>
            <div class="inputBox">
            <input type="password" required minlength="6" autocomplete="new-password" />
            <i>Password (6+ characters)</i>
            </div>
            <div class="links">
            <span>Already have an account?</span>
            <a href="login.html">Sign In</a>
            </div>
            <div class="inputBox">
            <input type="submit" value="Create Account" />
            </div>
        </form>
        <p class="notice" role="status"></p>
        </div>
    </main>
    </section>
    <script src="auth.js"></script>
</body>
</html>
